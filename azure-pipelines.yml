trigger:
  - feature/cicd-pipeline

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.12'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
  displayName: 'Use Python $(pythonVersion)'

- script: |
    pwd
    ls -la
    find . -type f | sort
  displayName: 'Debug Repository Structure'

- script: |
    python -m pip install --upgrade pip
    pip install -r backend/requirements.txt
  displayName: 'Install Dependencies'

- script: |
    python -m py_compile backend/app/__init__.py
    python -m py_compile backend/app/config/settings.py
    python -m py_compile backend/app/database/db.py
  displayName: 'Validate Python Syntax'

- script: |
    docker build -t expense-tracker-api ./backend
  displayName: 'Build Docker Image'