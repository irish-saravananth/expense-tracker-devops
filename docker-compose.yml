services:
  postgres:
    image: postgres:16
    container_name: expense-postgres

    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: expense-api

    ports:
      - "5001:5001"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: expense_tracker
      DB_USER: expense_user
      DB_PASSWORD: expense_password
      SECRET_KEY: dev-super-secret-key-change-this-to-a-long-random-string
      JWT_SECRET_KEY: 8b2d8d9f5a3e7c1f9d0b4e6a8c2f7d5e9a1b3c4d5e6f7a8b
      FLASK_ENV: production

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data: